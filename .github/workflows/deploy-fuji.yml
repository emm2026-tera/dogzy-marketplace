name: Deploy Contracts to Avalanche Fuji

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "contracts/**"
      - ".github/workflows/deploy-fuji.yml"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            contracts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Compile contracts
        run: pnpm hardhat compile

      - name: Run tests
        run: pnpm hardhat test

      - name: Deploy to Fuji
        env:
          AVAX_FUJI_RPC_URL: ${{ secrets.AVAX_FUJI_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: pnpm hardhat run scripts/deploy.ts --network fuji
